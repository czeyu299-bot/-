name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter Skeleton
        run: flutter create --org com.example --project-name factory_shift .

      - name: Restore Custom Files
        run: |
          git checkout -- pubspec.yaml
          git checkout -- lib/
          git checkout -- android/app/src/main/AndroidManifest.xml
          git checkout -- android/app/src/main/kotlin/com/example/factory_shift/MainActivity.kt

      - name: Fix Geolocator Plugin Bug
        run: |
          FIND_FILE=$(find ~/.pub-cache/hosted/pub.dev/ -path "*/geolocator_android/android/build.gradle" | head -n 1)
          if [ -n "$FIND_FILE" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' $FIND_FILE
            sed -i 's/compileSdkVersion project.android.compileSdkVersion/compileSdkVersion 35/' $FIND_FILE
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/' $FIND_FILE
          fi

      - name: Overwrite App build.gradle
        run: |
          cat << 'EOF' > android/app/build.gradle
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) { throw new GradleException("Flutter SDK not found.") }
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) { flutterVersionCode = '1' }
          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) { flutterVersionName = '1.0' }
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
          android {
              namespace "com.example.factory_shift"
              compileSdkVersion 35
              ndkVersion flutter.ndkVersion
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
              sourceSets { main.java.srcDirs += 'src/main/kotlin' }
              defaultConfig {
                  applicationId "com.example.factory_shift"
                  minSdkVersion 23
                  targetSdkVersion 35
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }
              buildTypes {
                  release { signingConfig signingConfigs.debug }
              }
          }
          flutter { source '../..' }
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
